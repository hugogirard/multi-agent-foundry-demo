<div class="login-page">
    <!-- Decorative floating shapes -->
    <div class="login-orb login-orb-1"></div>
    <div class="login-orb login-orb-2"></div>
    <div class="login-orb login-orb-3"></div>

    <div class="login-card">
        <!-- Brand -->
        <div class="login-brand">
            <span class="material-icons login-brand-icon">flight_takeoff</span>
            <h1 class="login-brand-text">Contoso Travel</h1>
        </div>

        <p class="login-tagline">Your AI-powered travel booking assistant</p>

        <!-- Sign-in -->
        <div class="login-form">
            <p class="login-subtitle">Sign in to search flights, make reservations, and chat with our AI travel
                agent.</p>

            <button class="login-entra-btn" type="button" (click)="login()">
                <img class="login-entra-icon" src="images/microsoft-logo.svg" alt="Microsoft logo" />
                <span>Sign in with Microsoft</span>
            </button>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <span class="material-icons login-footer-icon">shield</span>
            <span>Protected by Microsoft Entra ID</span>
        </div>
    </div>
</div>
