name: azd-foundry-multi-agent
metadata:
  template: azd-starter-bicep

hooks:
  postprovision:
    - shell: pwsh
      run: scripts/deploy-apps.ps1
    - shell: pwsh
      run: scripts/deploy-foundry-connection.ps1
    - shell: pwsh
      run: scripts/deploy-agent.ps1
    - shell: pwsh
      run: scripts/load-data.ps1
    - shell: pwsh
      run: scripts/grand-admin-consent.ps1
