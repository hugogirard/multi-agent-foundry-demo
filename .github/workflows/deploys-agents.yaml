name: Deploys Foundry Agents

on:
  workflow_dispatch:

jobs:
  deploy-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync
        working-directory: agents

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Assign Foundry Platform Owner role to service principal
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')
          SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')
          OBJECT_ID=$(az ad sp show --id "$CLIENT_ID" --query id -o tsv)
          SCOPE="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.CognitiveServices/accounts/${{ secrets.FOUNDRY_RESOURCE_NAME }}"
          az role assignment create --assignee "$OBJECT_ID" --role "c883944f-8b7b-4483-af10-35834be79c4a" --scope "$SCOPE" || true

      - name: Run agents creation script
        id: create-agents
        env:
          FOUNDRY_PROJECT_ENDPOINT: "https://${{secrets.FOUNDRY_RESOURCE_NAME}}.services.ai.azure.com/api/projects/${{secrets.PROJECT_NAME}}"
          MCP_FLIGHT_SERVER_URL: "https://${{secrets.MCP_FLIGHT_WEBAPP_NAME}}.azurewebsites.net/mcp"
          MCP_HOTEL_SERVER_URL: "https://${{secrets.MCP_HOTEL_WEBAPP_NAME}}.azurewebsites.net/mcp"
          AZURE_OPENAI_MODEL: ${{secrets.AZURE_OPENAI_MODEL}}
        run: |
          uv run main.py
        working-directory: agents

      - name: Save agent versions to secrets
        env:
          GH_TOKEN: ${{ secrets.PA_TOKEN }}
        run: |
          gh secret set FLIGHT_AGENT_VERSION --body "${{ steps.create-agents.outputs.flight_agent_version }}"
          gh secret set HOTEL_AGENT_VERSION --body "${{ steps.create-agents.outputs.hotel_agent_version }}"
