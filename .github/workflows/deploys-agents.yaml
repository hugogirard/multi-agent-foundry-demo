name: Deploys Foundry Agents

on:
  workflow_dispatch:

jobs:
  deploy-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync
        working-directory: agents

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Assign Azure AI Developer role to service principal
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')
          SUBSCRIPTION_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.subscriptionId')
          OBJECT_ID=$(az ad sp show --id "$CLIENT_ID" --query id -o tsv)
          az role assignment create \
            --assignee "$OBJECT_ID" \
            --role "Azure AI Developer" \
            --scope /subscriptions/$SUBSCRIPTION_ID/resourceGroups/${{ secrets.AZURE_RESOURCE_GROUP }}/providers/Microsoft.CognitiveServices/accounts/${{ secrets.FOUNDRY_RESOURCE_NAME }}

      - name: Run agents creation script
        id: create-agent
        env:
          # Add your environment variables here
          FOUNDRY_PROJECT_ENDPOINT: "https://${{secrets.FOUNDRY_RESOURCE_NAME}}.services.ai.azure.com/api/projects/${{secrets.PROJECT_NAME}}"
          MCP_SERVER_URL: "https://${{secrets.MCP_FLIGHT_WEBAPP_NAME}}.azurewebsites.net/mcp"
          AZURE_OPENAI_MODEL: ${{secrets.AZURE_OPENAI_MODEL}}
        run: |
          uv run main.py
        working-directory: agents

      - name: Save agent version to secret
        env:
          GH_TOKEN: ${{ secrets.PA_TOKEN }}
        run: |
          gh secret set FLIGHT_AGENT_VERSION --body "${{ steps.create-agent.outputs.agent_version }}"
