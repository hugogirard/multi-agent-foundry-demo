# ---------------------------------------------------------------------------
# Deploy Foundry MCP Connection
# ---------------------------------------------------------------------------
# This workflow handles the imperative post-deployment steps that Bicep
# cannot express declaratively:
#
#   1. Generates a client secret on the Entra ID app registration
#      (Graph API addPassword – not possible in Bicep).
#
#   2. Creates / updates the MCP connection at the Foundry *project* level
#      via the ARM REST API, so the agent can discover MCP tools.
#
#   3. Extracts the OAuth consent redirect URL returned by the connection
#      and patches it into the app registration's redirect URIs.
#
# Trigger: manual (workflow_dispatch). Typically run after the infra
# workflow has provisioned all Azure resources and stored their names
# as GitHub secrets.
# ---------------------------------------------------------------------------
name: Deploy Foundry MCP Connection

on:
    workflow_dispatch:

jobs:
    deploy-foundry-connection:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Azure Login
              uses: Azure/login@v3.0.0
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy Foundry MCP Connection
              env:
                  FOUNDRY_CONNECTION_MCP_CLIENT_ID: ${{ secrets.FOUNDRY_CONNECTION_MCP_CLIENT_ID }}
                  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
                  MCP_FLIGHT_WEBAPP_NAME: ${{ secrets.MCP_FLIGHT_WEBAPP_NAME }}
                  FOUNDRY_RESOURCE_NAME: ${{ secrets.FOUNDRY_RESOURCE_NAME }}
                  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
              run: |
                  chmod +x ./scripts/deploy-foundry-connection.sh
                  ./scripts/deploy-foundry-connection.sh
