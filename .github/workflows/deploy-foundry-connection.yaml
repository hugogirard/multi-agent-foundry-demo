name: Deploy Foundry MCP Connection

on:
    workflow_dispatch:

jobs:
    deploy-foundry-connection:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Azure Login
              uses: Azure/login@v3.0.0
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy Foundry MCP Connection
              env:
                  FOUNDRY_CONNECTION_MCP_CLIENT_ID: ${{ secrets.FOUNDRY_CONNECTION_MCP_CLIENT_ID }}
                  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
                  MCP_FLIGHT_WEBAPP_NAME: ${{ secrets.MCP_FLIGHT_WEBAPP_NAME }}
                  FOUNDRY_RESOURCE_NAME: ${{ secrets.FOUNDRY_RESOURCE_NAME }}
                  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
              run: |
                  chmod +x ./scripts/deploy-foundry-connection.sh
                  ./scripts/deploy-foundry-connection.sh
