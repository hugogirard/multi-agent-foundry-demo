    #
    #               echo "FLIGHT_MCP_SERVER_CLIENT_ID=$FLIGHT_MCP_SERVER_CLIENT_ID" >> $GITHUB_OUTPUT
    #               echo "HOTEL_MCP_SERVER_CLIENT_ID=$HOTEL_MCP_SERVER_CLIENT_ID" >> $GITHUB_OUTPUT
    #               echo "FLIGHT_AGENT_API_CLIENT_ID=$FLIGHT_AGENT_API_CLIENT_ID" >> $GITHUB_OUTPUT
    #               echo "FOUNDRY_CONNECTION_MCP_CLIENT_ID=$FOUNDRY_CONNECTION_MCP_CLIENT_ID" >> $GITHUB_OUTPUT
