    #               gh secret set OPENAPI_CLIENT_ID --body "${{ steps.appRegistrations.outputs.OPENAPI_CLIENT_ID }}"

    # -----------------------------------------------------------------
    # Post-provision: wire up the Foundry MCP connection
    # -----------------------------------------------------------------
    # Bicep creates the connection resource, but three things can only
    # happen imperatively after deployment:
    #   1. Generate a client secret on the Entra app (Graph API)
    #   2. Create/update the connection at the Foundry *project* level
    #   3. Patch the OAuth consent redirect URI back into the app
    # See scripts/deploy-foundry-connection.sh for full details.
    # -----------------------------------------------------------------
    update-mcp-foundry-connection:
        needs: create-azure-resources
        if: |
            always() &&
            (inputs.job_to_run == 'update-mcp-foundry-connection' ||
             (inputs.job_to_run == 'all' && needs.create-azure-resources.result == 'success'))
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Azure Login
              uses: Azure/login@v3.0.0
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Wait for App Registration propagation
              run: sleep 120

            - name: Update Foundry MCP Connection
              env:
                  FOUNDRY_CONNECTION_MCP_CLIENT_ID: ${{ secrets.FOUNDRY_CONNECTION_MCP_CLIENT_ID }}
                  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
                  MCP_FLIGHT_WEBAPP_NAME: ${{ secrets.MCP_FLIGHT_WEBAPP_NAME }}
                  FOUNDRY_RESOURCE_NAME: ${{ secrets.FOUNDRY_RESOURCE_NAME }}
                  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
              run: |
                  chmod +x ./scripts/deploy-foundry-connection.sh
                  ./scripts/deploy-foundry-connection.sh

    # -----------------------------------------------------------------
    # Post-provision: grant admin consent for all app registrations
    # -----------------------------------------------------------------
    grant-admin-consent:
        needs: create-azure-resources
        if: |
            always() &&
            (inputs.job_to_run == 'grant-admin-consent' ||
             (inputs.job_to_run == 'all' && needs.create-azure-resources.result == 'success'))
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Azure Login
              uses: Azure/login@v3.0.0
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Wait for Entra ID propagation
              run: sleep 60

            - name: Grant Admin Consent
              shell: pwsh
              env:
                  FLIGHT_MCP_SERVER_CLIENT_ID: ${{ secrets.FLIGHT_MCP_SERVER_CLIENT_ID }}
                  FOUNDRY_CONNECTION_MCP_CLIENT_ID: ${{ secrets.FOUNDRY_CONNECTION_MCP_CLIENT_ID }}
              run: ./scripts/grant-admin-consent.ps1
