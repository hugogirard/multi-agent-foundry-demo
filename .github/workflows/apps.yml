name: Deploys Apps

on:
  workflow_dispatch:
    inputs:
      deploy-target:
        description: "Select what to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - mcp-server
          - conversation-api
          - frontend

jobs:
  deploy-mcp-server:
    if: ${{ github.event.inputs.deploy-target == 'all' || github.event.inputs.deploy-target == 'mcp-server' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: Azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push image
        run: |
          az acr login -n ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}
          az acr build -r ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }} -t mcp-flight-server:${{ github.sha }} -t mcp-flight-server:latest --build-arg BUILDKIT_INLINE_CACHE=1 .
        working-directory: src/mcp/flight-server

      - name: Generate App Secret
        id: generate-secret
        run: |
          APP_OBJECT_ID=$(az ad app show --id ${{ secrets.FLIGHT_MCP_SERVER_CLIENT_ID }} --query id -o tsv)
          SECRET=$(az rest --method POST \
          --url "https://graph.microsoft.com/v1.0/applications/$APP_OBJECT_ID/addPassword" \
          --body '{"passwordCredential":{"displayName":"GitHub Actions"}}' \
          --query secretText -o tsv)
          echo "::add-mask::$SECRET"
          echo "CLIENT_SECRET=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Set App Settings
        uses: Azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.MCP_FLIGHT_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "ENTRA_CLIENT_ID", "value": "${{ secrets.FLIGHT_MCP_SERVER_CLIENT_ID }}" },
              { "name": "ENTRA_CLIENT_SECRET", "value": "${{ steps.generate-secret.outputs.CLIENT_SECRET }}" }
            ]

      - uses: azure/webapps-deploy@v2
        with:
          app-name: ${{secrets.MCP_FLIGHT_WEBAPP_NAME}}
          images: "${{secrets.AZURE_CONTAINER_REGISTRY_NAME}}.azurecr.io/mcp-flight-server:${{ github.sha }}"

  deploy-conversation-api:
    if: ${{ github.event.inputs.deploy-target == 'all' || github.event.inputs.deploy-target == 'conversation-api' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: Azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push image
        run: |
          az acr login -n ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}
          az acr build -r ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }} -t conversation-api:${{ github.sha }} -t conversation-api:latest --build-arg BUILDKIT_INLINE_CACHE=1 .
        working-directory: src/api/conversation-api

      - name: Generate App Secret
        id: generate-secret
        run: |
          APP_OBJECT_ID=$(az ad app show --id ${{ secrets.CONVERSATION_API_CLIENT_ID }} --query id -o tsv)
          SECRET=$(az rest --method POST \
          --url "https://graph.microsoft.com/v1.0/applications/$APP_OBJECT_ID/addPassword" \
          --body '{"passwordCredential":{"displayName":"GitHub Actions"}}' \
          --query secretText -o tsv)
          echo "::add-mask::$SECRET"
          echo "CLIENT_SECRET=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Set App Settings
        uses: Azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.CONVERSATION_API_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "AZURE_CLIENT_ID", "value": "${{ secrets.CONVERSATION_API_CLIENT_ID }}" },
              { "name": "CLIENT_ID", "value": "${{ secrets.CONVERSATION_API_CLIENT_ID }}" },
              { "name": "CLIENT_SECRET", "value": "${{ steps.generate-secret.outputs.CLIENT_SECRET }}" },
              { "name": "OPENAPI", "value": "${{ secrets.OPENAPI_CLIENT_ID }}" }
            ]

      - uses: azure/webapps-deploy@v2
        with:
          app-name: ${{secrets.CONVERSATION_API_WEBAPP_NAME}}
          images: "${{secrets.AZURE_CONTAINER_REGISTRY_NAME}}.azurecr.io/conversation-api:${{ github.sha }}"

  deploy-frontend:
    if: ${{ github.event.inputs.deploy-target == 'all' || github.event.inputs.deploy-target == 'frontend' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        uses: Azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Replace environment tokens
        run: |
          TENANT_ID=$(az account show --query tenantId -o tsv)
          FRONTEND_CLIENT_ID=$(az ad app list --display-name "Front-End Chatbot Trip Reservation" --query "[0].appId" -o tsv)
          APP_INSIGHT_CNX=$(az monitor app-insights component show \
            --app ${{ secrets.APPLICATION_INSIGHT_RESOURCE_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query connectionString -o tsv)

          sed -i "s|__clientId__|$FRONTEND_CLIENT_ID|g" src/app/environments/environment.prod.ts
          sed -i "s|__authority__|https://login.microsoftonline.com/$TENANT_ID|g" src/app/environments/environment.prod.ts
          sed -i "s|__apiScopes__|api://${{ secrets.CONVERSATION_API_WEBAPP_NAME }}/user_impersonation|g" src/app/environments/environment.prod.ts
          sed -i "s|__apiBaseUrl__|https://${{ secrets.CONVERSATION_API_WEBAPP_NAME }}.azurewebsites.net|g" src/app/environments/environment.prod.ts
          sed -i "s|__redirectUrl__|https://${{ secrets.FRONTEND_RESOURCE_NAME }}.azurewebsites.net|g" src/app/environments/environment.prod.ts
          sed -i "s|__appInsightKey__|$APP_INSIGHT_CNX|g" src/app/environments/environment.prod.ts
        working-directory: src/frontend

      - name: Build and Push image
        run: |
          az acr login -n ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}
          az acr build -r ${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }} -t frontend:${{ github.sha }} -t frontend:latest --build-arg BUILDKIT_INLINE_CACHE=1 .
        working-directory: src/frontend

      - uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.FRONTEND_RESOURCE_NAME }}
          images: "${{ secrets.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/frontend:${{ github.sha }}"
